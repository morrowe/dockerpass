services:
    web-app:
        build: ./app
        container_name: web-app
        environment:
            REDIS_URL: redis://redis:6379
            CACHE_TTL: 60
        ports:
            - '3000:3000'
        depends_on:
            database:
                condition: service_healthy
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    database:
        build: ./database
        container_name: database
        ports:
            - '5005:5005'
        depends_on:
            postgres:
                condition: service_healthy

        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5005/health || exit 1"]
            interval: 3s
            timeout: 5s
            retries: 60

    postgres:
        image: postgres:17
        container_name: postgres
        environment:
            POSTGRES_DB: form
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - '5435:5432'
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d form"]
            interval: 2s
            timeout: 5s
            retries: 30
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    redis:
        image: redis:7-alpine
        container_name: redis
        ports:
            - '6379:6379'
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 2s
            timeout: 3s
            retries: 15

    test:
        build: ./test
        container_name: test
        depends_on:
            web-app:
                condition: service_started
            database:
                condition: service_healthy
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

volumes:
    postgres_data:
